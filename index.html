<!DOCTYPE html>
<html>

<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LTHSFLORALS - Era Sorter</title>

<script type="text/javascript">
<!--

var namMember = new Array(
  "PEAKY BLINDERS",
  "FETUS LOUIS",
  "LONG HAIR",
  "HDIGH ERA",
  "HEDGEHOG",
  "LOUIS 2013",
  "PRINCE HAIR LOUIS",
  "LOUIS WALLS ERA",
  "FITF ERA",
  "LOUIS THE X FACTOR"
);

var lstMember = new Array();
var parent = new Array();
var equal = new Array();
var rec = new Array();
var cmp1, cmp2;
var head1, head2;
var nrec;

var numQuestion;
var totalSize;
var finishSize;
var finishFlag;

function initList(){
  var n = 0;
  var mid;
  var i;

  lstMember[n] = new Array();
  for (i=0; i<namMember.length; i++) {
    lstMember[n][i] = i;
  }
  parent[n] = -1;
  totalSize = 0;
  n++;

  for (i=0; i<lstMember.length; i++) {
    if(lstMember[i].length>=2) {
      mid = Math.ceil(lstMember[i].length/2);
      lstMember[n] = new Array();
      lstMember[n] = lstMember[i].slice(0,mid);
      totalSize += lstMember[n].length;
      parent[n] = i;
      n++;
      lstMember[n] = new Array();
      lstMember[n] = lstMember[i].slice(mid,lstMember[i].length);
      totalSize += lstMember[n].length;
      parent[n] = i;
      n++;
    }
  }

  for (i=0; i<namMember.length; i++) {
    rec[i] = 0;
  }
  nrec = 0;

  for (i=0; i<=namMember.length; i++) {
    equal[i] = -1;
  }

  cmp1 = lstMember.length-2;
  cmp2 = lstMember.length-1;
  head1 = 0;
  head2 = 0;
  numQuestion = 1;
  finishSize = 0;
  finishFlag = 0;
}

function sortList(flag){
  var i;
  var str;

  if (flag<0) {
    rec[nrec] = lstMember[cmp1][head1];
    head1++;
    nrec++;
    finishSize++;
    while (equal[rec[nrec-1]]!=-1) {
      rec[nrec] = lstMember[cmp1][head1];
      head1++;
      nrec++;
      finishSize++;
    }
  }
  else if (flag>0) {
    rec[nrec] = lstMember[cmp2][head2];
    head2++;
    nrec++;
    finishSize++;
    while (equal[rec[nrec-1]]!=-1) {
      rec[nrec] = lstMember[cmp2][head2];
      head2++;
      nrec++;
      finishSize++;
    }
  }
  else {
    rec[nrec] = lstMember[cmp1][head1];
    head1++;
    nrec++;
    finishSize++;
    while (equal[rec[nrec-1]]!=-1) {
      rec[nrec] = lstMember[cmp1][head1];
      head1++;
      nrec++;
      finishSize++;
    }
    equal[rec[nrec-1]] = lstMember[cmp2][head2];
    rec[nrec] = lstMember[cmp2][head2];
    head2++;
    nrec++;
    finishSize++;
    while (equal[rec[nrec-1]]!=-1) {
      rec[nrec] = lstMember[cmp2][head2];
      head2++;
      nrec++;
      finishSize++;
    }
  }

  if (head1<lstMember[cmp1].length && head2==lstMember[cmp2].length) {
    while (head1<lstMember[cmp1].length){
      rec[nrec] = lstMember[cmp1][head1];
      head1++;
      nrec++;
      finishSize++;
    }
  }
  else if (head1==lstMember[cmp1].length && head2<lstMember[cmp2].length) {
    while (head2<lstMember[cmp2].length){
      rec[nrec] = lstMember[cmp2][head2];
      head2++;
      nrec++;
      finishSize++;
    }
  }

  if (head1==lstMember[cmp1].length && head2==lstMember[cmp2].length) {
    for (i=0; i<lstMember[cmp1].length+lstMember[cmp2].length; i++) {
      lstMember[parent[cmp1]][i] = rec[i];
    }
    lstMember.pop();
    lstMember.pop();
    cmp1 = cmp1-2;
    cmp2 = cmp2-2;
    head1 = 0;
    head2 = 0;

    if (head1==0 && head2==0) {
      for (i=0; i<namMember.length; i++) {
        rec[i] = 0;
      }
      nrec = 0;
    }
  }

  if (cmp1<0) {
    str = "battle #"+(numQuestion-1)+"<br>"+Math.floor(finishSize*100/totalSize)+"% sorted.";
    document.getElementById("battleNumber").innerHTML = str;
    showResult();
    finishFlag = 1;
  }
  else {
    showImage();
  }
}

function showResult() {
  var ranking = 1;
  var sameRank = 1;
  var str = "";
  var i;

  str += "<table style=\"width:320px; font-size:16px; line-height:140%; margin-left:auto; margin-right:auto; border:1px solid #333; border-collapse:collapse\" align=\"center\">";
  str += "<tr><td style=\"color:#ffffff; background-color:#e097d9; text-align:center; padding:5px;\">rank<\/td><td style=\"color:#ffffff; background-color:#e097d9; text-align:center; padding:5px;\">options<\/td><\/tr>";

  for (i=0; i<namMember.length; i++) {
    str += "<tr><td style=\"border:1px solid #ccc; text-align:center; padding:5px;\">"+ranking+"<\/td><td style=\"border:1px solid #ccc; padding:5px; text-align:left;\">"+namMember[lstMember[0][i]]+"<\/td><\/tr>";
    if (i<namMember.length-1) {
      if (equal[lstMember[0][i]]==lstMember[0][i+1]) {
        sameRank++;
      } else {
        ranking += sameRank;
        sameRank = 1;
      }
    }
  }
  str += "<\/table>";

  document.getElementById("resultField").innerHTML = str;
}

function showImage() {
  var str0 = "battle #"+numQuestion+"<br>"+Math.floor(finishSize*100/totalSize)+"% sorted.";
  var str1 = ""+toNameFace(lstMember[cmp1][head1]);
  var str2 = ""+toNameFace(lstMember[cmp2][head2]);

  document.getElementById("battleNumber").innerHTML = str0;
  document.getElementById("leftField").innerHTML = str1;
  document.getElementById("rightField").innerHTML = str2;

  numQuestion++;
}

function toNameFace(n){
  return namMember[n];
}
//-->
</script>

<style type="text/css">
body {
  max-width: 600px;
  margin: 0 auto;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 10px;
}

#mainTable {
  font-size: 16px;
  text-align: center;
  vertical-align: middle;
  width: 100%;
  max-width: 450px;
  margin: 0 auto;
  border-collapse: separate;
  border-spacing: 10px 10px;
}

#leftField, #rightField {
  width: 40%;
  height: 120px;
  border: 2px solid #e097d9;
  border-radius: 8px;
  cursor: pointer;
  background-color: #fafafa;
  font-weight: bold;
  padding: 10px;
}

#leftField:hover, #rightField:hover {
  background-color: #f2d2ee;
}

.middleField {
  width: 20%;
  height: 120px;
  border: 1px solid #ccc;
  border-radius: 6px;
  cursor: pointer;
  background-color: #eee;
  font-size: 13px;
  font-weight: bold;
}

.middleField:hover {
  background-color: #ddd;
}

h1 {
  color: #e097d9;
}
</style>
</head>

<body>

<h1>LTHSFLORALS</h1>
<p class="instructions">
pick YOUR favorite era (be honest)<br>
<i>note: hitting 'I like both' frequently will negatively affect your results.</i>
</p>

<table id="mainTable" align="center">
  <tbody>
    <tr>
      <td id="battleNumber" colspan="3" style="padding-bottom: 15px; text-align:center;">
        <b>battle #1<br>0% sorted.</b>
      </td>
    </tr>
    <tr>
      <td id="leftField" onclick="if(finishFlag==0) sortList(-1);"></td>
      <td class="middleField" onclick="if(finishFlag==0) sortList(0);">I like both</td>
      <td id="rightField" onclick="if(finishFlag==0) sortList(1);"></td>
    </tr>
  </tbody>
</table>

<br><br>
<div id="resultField"></div>

<script type="text/javascript">
<!--
initList();
showImage();
//-->
</script>

</body>
</html>
